name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calorie
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: calorietracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U calorie"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      # Throwaway database inside the CI job; no production secrets are needed.
      TEST_DATABASE_CONNECTION: Host=localhost;Port=5432;Database=calorietracker_test;Username=calorie;Password=ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - name: Check migrations are up to date
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/CalorieTracker.Web --configuration Release --no-build
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Database=unused
      - name: Unit and integration tests
        run: dotnet test --configuration Release --no-build --logger "console;verbosity=normal"
      - name: Build Docker image
        run: docker build -t nutritrack:ci .
